<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misi Analisis Kesalahan: Barisan & Deret Aritmetika</title>
  
  <!-- KaTeX for beautiful math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,300..700;1,300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..700,0..1;1,300..700,0..1&display=swap');

    :root {
      --ff-sans: 'Google Sans Flex', sans-serif;
      --ff-mono: 'Google Sans Code', monospace;
      --surface: #fdfcfc;
      --surface-dim: #f2f0f0;
      --surface-bright: #ffffff;
      --surface-container: #f2f0f0;
      --surface-container-high: #e6e6e6;
      --on-surface: #000000;
      --on-surface-variant: rgba(0, 0, 0, 0.55);
      --primary: #3186ff;
      --primary-container: #dcf1ff;
      --accent-fixed: #3186ff;
      --positive: #008052;
      --positive-container: #daf9d4;
      --error: #de2d29;
      --error-container: #ffdeec;
      --outline: #727676;
      --stroke-default: #e3e3e3;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--ff-sans);
      background: var(--surface);
      color: var(--on-surface);
      -webkit-font-smoothing: antialiased;
    }

    .widget-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-card {
      background: var(--surface-dim);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .step-badge, .score-badge {
      font-family: var(--ff-mono);
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .step-badge {
      background: var(--primary-container);
      color: var(--accent-fixed);
      font-weight: 600;
    }

    .score-badge {
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--surface-container-high);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .problem-box {
      background: var(--surface-container);
      border-radius: 8px;
      padding: 16px;
      font-size: 15px;
      line-height: 1.6;
    }

    .scratchpad-card {
      background: var(--surface-bright);
      border: 1px dashed var(--outline);
      border-radius: 12px;
      padding: 16px;
      margin-block: 8px;
    }

    .scratchpad-title {
      font-family: var(--ff-mono);
      font-size: 13px;
      color: var(--on-surface-variant);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .math-text {
      font-size: 15px;
      line-height: 1.7;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .option-card {
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .option-card:hover { background: var(--surface-container-high); }
    .option-card.is-selected { border-color: var(--primary); background: var(--primary-container); }
    .option-card.is-correct { border-color: var(--positive); background: var(--positive-container); }
    .option-card.is-wrong { border-color: var(--error); background: var(--error-container); }

    .option-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--outline);
      margin-top: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .option-card.is-selected .option-radio {
      border-color: var(--accent-fixed);
      background: var(--accent-fixed);
    }

    .option-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--surface-bright);
      display: none;
    }

    .option-card.is-selected .option-radio::after { display: block; }

    .explanation-card {
      background: var(--surface-dim);
      border-left: 4px solid var(--primary);
      border-radius: 0 12px 12px 0;
      padding: 16px;
      margin-top: 16px;
      display: none;
    }

    .explanation-card.is-visible { display: block; }

    .nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    .lumi-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 20px;
      font-family: var(--ff-sans);
      font-size: 14px;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid var(--stroke-default);
      background: var(--surface-bright);
      color: var(--on-surface);
      cursor: pointer;
      transition: all 0.15s;
    }

    .lumi-btn:hover:not(:disabled) { background: var(--surface-container-high); }
    .lumi-btn-primary { background: var(--primary); color: white; border-color: transparent; }
    .lumi-btn-primary:hover:not(:disabled) { background: #1a6fe6; }
    .lumi-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="header-card">
      <div class="header-top">
        <span id="step-badge" class="step-badge">Tahap 1 / 8</span>
        <span id="score-badge" class="score-badge">Skor Diagnosis: 0/6</span>
      </div>
      <div class="progress-bar-container">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <h2 id="step-title" style="margin: 6px 0 0 0; font-size: 22px;">Misi Analisis Kesalahan: Barisan & Deret</h2>
    </div>

    <div id="content-zone">
      <!-- Dynamic step content injected here -->
    </div>

    <div class="nav-actions">
      <button id="btn-prev" class="lumi-btn" style="visibility: hidden;">Kembali</button>
      <button id="btn-next" class="lumi-btn lumi-btn-primary" disabled>Mulai Diagnosis</button>
    </div>
  </div>

  <script>
    const MISSION_DATA = [
      {
        step: 1,
        type: "intro",
        title: "Misi Analisis Kesalahan: Aritmetika",
        content: "Halo, Pejuang PTN Kelas XII! Soal barisan dan deret di TKA sering kali mengecoh, bukan karena rumusnya yang susah, melainkan ketelitian dalam mengidentifikasi apa yang sebenarnya ditanyakan. Mari kita asah logikamu!\n\n**Soal Utama:**\nSebuah gedung pertunjukan memiliki susunan kursi yang membentuk barisan aritmetika. Baris paling depan (baris pertama) memiliki 15 kursi. Baris ke-4 memiliki 27 kursi. Jika gedung tersebut memiliki total 20 baris kursi, tentukanlah:\n1) Banyaknya kursi pada baris terakhir.\n2) Total kapasitas kursi di seluruh gedung tersebut!\n\nTugasmu adalah mendiagnosis 6 coretan jawaban fiktif siswa yang melakukan kesalahan fatal dalam materi barisan dan deret ini. Sudah siap?",
        wrong_answer_text: "",
        question: "",
        options: [],
        correct_index: 0,
        explanation: ""
      },
      {
        step: 2,
        type: "quiz",
        title: "Analisis Kasus 1: Coretan Andi",
        content: "**Reminder Soal Utama:**\nBarisan aritmetika, Baris ke-1 = 15, Baris ke-4 = 27. Total 20 baris.\nTentukan: (1) Banyak kursi baris terakhir, (2) Total kapasitas kursi.",
        wrong_answer_text: "Mencari nilai beda (b):\nDiketahui $a = 15$ dan $U_4 = 27$.\n$U_4 = a + 4b = 27$\n$15 + 4b = 27$\n$4b = 12 \\implies b = 3$",
        question: "Andi mencari nilai beda (b) antar baris. Namun, ada satu kesalahan fundamental di awal persamaan. Apa itu?",
        options: [
          "Andi salah menghitung 27 dikurang 15, seharusnya hasilnya 10.",
          "Rumus suku ke-4 ($U_4$) pada barisan aritmetika adalah $a + 3b$, bukan $a + 4b$.",
          "Nilai beda (b) dalam barisan aritmetika untuk jumlah kursi tidak boleh bernilai ganjil."
        ],
        correct_index: 1,
        explanation: "Diagnosis Jitu! Rumus umum suku ke-n adalah $U_n = a + (n - 1)b$. Karena $n=4$, maka pengali untuk $b$ adalah $(4-1) = 3$. Andi menuliskan $4b$, yang membuat nilai bedanya menjadi 3, padahal yang benar adalah $3b = 12 \\implies b = 4$."
      },
      {
        step: 3,
        type: "quiz",
        title: "Analisis Kasus 2: Coretan Budi",
        content: "**Reminder Soal Utama:**\nBarisan aritmetika, Baris ke-1 = 15, Baris ke-4 = 27. Total 20 baris.\nTentukan: (1) Banyak kursi baris terakhir, (2) Total kapasitas kursi.",
        wrong_answer_text: "Banyak kursi baris terakhir:\n$n = 20 \\implies U_{20} = 15 + (20-1)4 = 15 + 19(4) = 15 + 76 = 91$\n\nKarena ada 20 baris, baris terakhir pastilah setelah 20. Jadi baris terakhir adalah $U_{21} = 91 + 4 = 95$.",
        question: "Budi *overthinking* (terlalu banyak berpikir) mengenai posisi baris terakhir. Apa letak miskonsepsi logikanya?",
        options: [
          "Baris terakhir dalam gedung yang memiliki tepat 20 baris ya $U_{20}$, tidak perlu ditambah satu indeks lagi menjadi $U_{21}$.",
          "Perkalian $19 \\times 4$ seharusnya menghasilkan $86$, bukan $76$.",
          "Rumus mencari suku terakhir seharusnya menggunakan deret $S_{20}$, bukan $U_{20}$."
        ],
        correct_index: 0,
        explanation: "Tepat sekali! Ini adalah fenomena psikologis yang sering disebut *Fencepost Error* atau keraguan berlebih. Jika total baris hanya ada 20, maka baris paling belakang mutlak adalah Suku ke-20 ($U_{20} = 91$). Menambahkannya dengan beda lagi menjadikannya baris fiktif."
      },
      {
        step: 4,
        type: "quiz",
        title: "Analisis Kasus 3: Coretan Citra",
        content: "**Reminder Soal Utama:**\nBarisan aritmetika, Baris ke-1 = 15, Baris ke-4 = 27. Total 20 baris.\nTentukan: (1) Banyak kursi baris terakhir, (2) Total kapasitas kursi.",
        wrong_answer_text: "Mencari pertanyaan (2) Total kapasitas kursi:\n\"Total kapasitas kursi berarti mencari suku ujung ke-20 ($U_{20}$).\nMaka kapasitas total gedung = $15 + 19(4) = 91$ kursi.\"",
        question: "Citra sering terjebak dalam soal cerita yang membedakan konsep Barisan dan Deret. Apa kesalahannya di sini?",
        options: [
          "Citra salah memasukkan nilai suku pertama, seharusnya $U_1$ tidak ikut dihitung dalam total.",
          "Citra lupa membagi hasil 91 dengan angka 2 (karena ini adalah deret rata-rata).",
          "Kata 'total kapasitas' merujuk pada jumlah seluruh kursi dari baris 1 sampai 20 ($S_{20}$), bukan hanya jumlah kursi pada baris ke-20 ($U_{20}$)."
        ],
        correct_index: 2,
        explanation: "Analisis yang mantap! Ini adalah jebakan literasi nomor satu. $U_{20}$ (Barisan) HANYA menghitung banyaknya kursi di jejeran baris paling belakang (91 kursi). Sedangkan 'Kapasitas Total' berarti $S_{20}$ (Deret), yaitu menjumlahkan baris 1 ditambah baris 2, hingga baris ke-20."
      },
      {
        step: 5,
        type: "quiz",
        title: "Analisis Kasus 4: Coretan Doni",
        content: "**Reminder Soal Utama:**\nBarisan aritmetika, Baris ke-1 = 15, Baris ke-4 = 27. Total 20 baris.\nTentukan: (1) Banyak kursi baris terakhir, (2) Total kapasitas kursi.",
        wrong_answer_text: "Rumus Total ($S_n$):\n$S_{20} = \\frac{20}{2}(2(15) + (20-1)4)$\n$S_{20} = 10(30 + 19 \\times 4)$\n$S_{20} = 10(49 \\times 4)$\n$S_{20} = 10(196) = 1960$",
        question: "Doni menggunakan rumus panjang $S_n$. Penjabarannya sudah benar, tetapi ia melakukan 'silly mistake' (kecerobohan) yang sangat fatal pada aturan dasar berhitung. Apa itu?",
        options: [
          "Doni tidak boleh menggunakan rumus panjang ini, ia wajib menggunakan rumus pendek $\\frac{n}{2}(a + U_n)$.",
          "Sesuai aturan hierarki (KaBaTaKu), operasi perkalian ($19 \\times 4$) wajib didahulukan sebelum dijumlahkan dengan 30.",
          "Hasil bagi $20 / 2$ seharusnya disederhanakan di tahap paling akhir, bukan di awal."
        ],
        correct_index: 1,
        explanation: "Sempurna! Kesalahan ini sering sekali dilakukan saat terburu-buru. Doni malah menjumlahkan $30 + 19$ terlebih dahulu (menjadi 49), baru mengalikannya dengan 4. Padahal seharusnya ia mengalikan $19 \\times 4 = 76$ dahulu, baru dijumlahkan dengan 30 (menjadi 106)."
      },
      {
        step: 6,
        type: "quiz",
        title: "Analisis Kasus 5: Coretan Eka",
        content: "**Reminder Soal Utama:**\nBarisan aritmetika, Baris ke-1 = 15, Baris ke-4 = 27. Total 20 baris.\nTentukan: (1) Banyak kursi baris terakhir, (2) Total kapasitas kursi.",
        wrong_answer_text: "Cara cepat rata-rata:\nTotal = Banyak Baris $\\times$ Nilai Tengah\nBanyak baris = 20. Baris tengahnya adalah baris ke-10.\n$U_{10} = 15 + 9(4) = 15 + 36 = 51$.\nTotal $= 20 \\times 51 = 1020$.",
        question: "Eka mencoba menggunakan trik nilai tengah, namun trik logikanya tidak pas diterapkan mentah-mentah pada kasus ini. Mengapa?",
        options: [
          "Barisan berjumlah genap ($n=20$) tidak memiliki satu suku tengah tepat di $U_{10}$. Rata-ratanya harus dihitung dari $\\frac{U_1 + U_{20}}{2}$.",
          "Eka salah menghitung $U_{10}$, seharusnya beda dikalikan 10 ($15 + 10(4) = 55$).",
          "Trik rata-rata atau nilai tengah sama sekali tidak berlaku pada barisan aritmetika."
        ],
        correct_index: 0,
        explanation: "Sangat Kritis! Jika datanya ganjil (misal 21), maka tepat ada 1 suku tengah ($U_{11}$). Karena genap (20 baris), titik tengahnya berada di antara baris 10 dan 11 (yaitu 53, didapat dari $\\frac{15 + 91}{2}$). Menggunakan $U_{10}$ saja menyebabkan total yang didapat kurang dari yang sebenarnya (1.060)."
      },
      {
        step: 7,
        type: "quiz",
        title: "Analisis Kasus 6: Coretan Fani",
        content: "**Reminder Soal Utama:**\nBarisan aritmetika, Baris ke-1 = 15, Baris ke-4 = 27. Total 20 baris.\nTentukan: (1) Banyak kursi baris terakhir, (2) Total kapasitas kursi.",
        wrong_answer_text: "Rumus cepat Total:\n$S_{20} = \\frac{n}{2} (a + U_n)$\n$S_{20} = \\frac{20}{2} (15 + U_{20})$\n$S_{20} = 10 (91) = 910$",
        question: "Fani memilih rumus yang paling efisien karena ia sudah mengetahui $U_{20}=91$. Tapi ia tergelincir di tahap substitusi akhir. Apa yang terlewatkan?",
        options: [
          "Fani mengalikan $10$ dengan $91$ padahal seharusnya operasi tersebut dibagikan.",
          "Fani menghilangkan suku pertama ($a=15$) di dalam kurung saat ke baris terakhir. Seharusnya $10(15 + 91) = 10(106) = 1060$.",
          "Nilai $U_{20}$ tidak boleh langsung dimasukkan sebagai 91, melainkan harus dipecah lagi menjadi $a+19b$ di rumus panjang."
        ],
        correct_index: 1,
        explanation: "Super Jeli! Fani menulis rumusnya dengan benar, namun saat beralih baris, ia seolah-olah mengabaikan angka 15 di dalam kurung dan langsung mengalikan 10 dengan 91. Kecerobohan penulisan/konsentrasi inilah yang sering membuat nilai hilang seketika di akhir penyelesaian."
      },
      {
        step: 8,
        type: "outro",
        title: "Misi Tuntas, Pejuang PTN!",
        content: "Hebat! Kamu telah mengidentifikasi 6 kelemahan yang kerap menghancurkan skor siswa di UTBK/TKA materi Barisan dan Deret.\nDari salah pakai indeks $U_n$, kebingungan beda Barisan dan Deret, kecerobohan hierarki hitung KaBaTaKu, sampai ilusi nilai tengah di barisan genap.\n\n**Tantangan Terakhir:**\nSiapkan selembar kertas. Dengan menggunakan prinsip yang sudah diluruskan, tulis ulang penyelesaian soal gedung tadi dari awal dengan rapi dan runtut!\n*(Spoiler: Jawaban akhirnya adalah baris terakhir **91 kursi**, dan kapasitas total gedung **1.060 kursi**)*.\n\nTeruslah berlatih, jaga konsentrasi, dan raih kampus mimpimu!",
        wrong_answer_text: "",
        question: "",
        options: [],
        correct_index: 0,
        explanation: ""
      }
    ];

    const state = {
      currentStep: 0,
      answers: {},
      scores: {}
    };

    function parseMarkdown(text) {
      if (!text) return "";
      let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function renderStepContent() {
      const data = MISSION_DATA[state.currentStep];
      const container = document.getElementById('content-zone');

      if (data.type === 'intro') {
        container.innerHTML = `
          <div class="math-text">${parseMarkdown(data.content)}</div>
        `;
      } else if (data.type === 'quiz') {
        const chosen = state.answers[state.currentStep];
        const isAnswered = chosen !== undefined;
        const isCorrect = isAnswered && chosen === data.correct_index;

        const optionsHTML = data.options.map((opt, idx) => {
          let cardClass = "option-card";
          if (isAnswered) {
            if (idx === data.correct_index) cardClass += " is-correct";
            else if (idx === chosen) cardClass += " is-wrong";
          } else if (idx === chosen) {
            cardClass += " is-selected";
          }

          return `
            <div class="${cardClass}" onclick="selectOption(${idx})">
              <div class="option-radio"></div>
              <div class="math-text" style="flex: 1;">${parseMarkdown(opt)}</div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="problem-box" style="margin-bottom: 16px;">
            <div class="math-text">${parseMarkdown(data.content)}</div>
          </div>
          
          <div class="scratchpad-card">
            <div class="scratchpad-title">Coretan Jawaban (Mengandung Kesalahan):</div>
            <div class="math-text">${parseMarkdown(data.wrong_answer_text)}</div>
          </div>

          <p class="math-text" style="margin: 20px 0 12px 0; font-weight: 600; font-size: 16px;">${parseMarkdown(data.question)}</p>

          <div class="options-group">
            ${optionsHTML}
          </div>

          <div class="explanation-card ${isAnswered ? 'is-visible' : ''}">
            <p class="math-text" style="margin: 0 0 6px 0; font-weight: bold; color: ${isCorrect ? 'var(--positive)' : 'var(--error)'};">
              ${isCorrect ? 'Diagnosis Tepat!' : 'Diagnosis Kurang Tepat'}
            </p>
            <p class="math-text" style="margin: 0;">${parseMarkdown(data.explanation)}</p>
          </div>
        `;
      } else if (data.type === 'outro') {
        container.innerHTML = `
          <div class="math-text">${parseMarkdown(data.content)}</div>
        `;
      }

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ],
          throwOnError: false
        });
      }
    }

    function updateHeaderAndNav() {
      const totalSteps = MISSION_DATA.length;
      const currentIdx = state.currentStep;
      const data = MISSION_DATA[currentIdx];

      document.getElementById('step-badge').textContent = `Tahap ${currentIdx + 1} / ${totalSteps}`;
      document.getElementById('step-title').textContent = data.title;
      document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / totalSteps) * 100}%`;

      const totalCorrect = Object.values(state.scores).filter(Boolean).length;
      document.getElementById('score-badge').textContent = `Skor Diagnosis: ${totalCorrect}/6`;

      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      btnPrev.style.visibility = currentIdx > 0 ? 'visible' : 'hidden';

      if (data.type === 'intro') {
        btnNext.textContent = 'Mulai Diagnosis';
        btnNext.disabled = false;
      } else if (data.type === 'quiz') {
        const isAnswered = state.answers[currentIdx] !== undefined;
        btnNext.textContent = currentIdx === totalSteps - 2 ? 'Lihat Hasil Misi' : 'Kasus Selanjutnya';
        btnNext.disabled = !isAnswered;
      } else if (data.type === 'outro') {
        btnNext.textContent = 'Ulangi Misi';
        btnNext.disabled = false;
      }
    }

    function selectOption(optIndex) {
      const currentIdx = state.currentStep;
      if (MISSION_DATA[currentIdx].type !== 'quiz') return;
      if (state.answers[currentIdx] !== undefined) return;

      state.answers[currentIdx] = optIndex;
      state.scores[currentIdx] = (optIndex === MISSION_DATA[currentIdx].correct_index);
      
      renderStepContent();
      updateHeaderAndNav();
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (state.currentStep > 0) {
        state.currentStep--;
        renderStepContent();
        updateHeaderAndNav();
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (state.currentStep < MISSION_DATA.length - 1) {
        state.currentStep++;
      } else {
        state.currentStep = 0;
        state.answers = {};
        state.scores = {};
      }
      renderStepContent();
      updateHeaderAndNav();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
          renderStepContent();
          updateHeaderAndNav();
      }, 100);
    });
  </script>
</body>
